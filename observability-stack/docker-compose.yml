version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.53.0 # Imagem oficial, tag fixada para evitar quebras
    container_name: marketplace-prometheus
    ports:
      - "9090:9090" # UI e API do Prometheus
    volumes:
      # Configuração de scrape (somente leitura)
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Regras de alerta (somente leitura)
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      # Persistir a TSDB do Prometheus
      - prometheus_data:/prometheus
    extra_hosts:
      # Permite ao container alcançar os serviços que rodam no host.
      # No Docker Desktop já funciona por padrão; esta entrada garante o
      # comportamento também no Docker Engine (Linux).
      - "host.docker.internal:host-gateway"
    # Sempre reiniciar se cair
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0 # Imagem oficial, tag fixada
    container_name: marketplace-grafana
    ports:
      - "3010:3000" # Grafana escuta em 3000 no container; mapeado para 3010 no host (evita conflito com users-service)
    environment:
      # Credenciais padrão de desenvolvimento (MUDAR EM PRODUÇÃO!)
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # Provisioning automático (datasource pré-configurado), somente leitura
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Persistir dados do Grafana
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    # Sempre reiniciar se cair
    restart: unless-stopped

# Volumes para persistência
volumes:
  prometheus_data:
  grafana_data:
